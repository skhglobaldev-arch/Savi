<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#faf5ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#581c87" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="168" y="136" width="280" height="250" rx="28" fill="#fff7ed" filter="url(#shadow)" transform="rotate(-5 308 261)"/>
  <rect x="486" y="112" width="300" height="266" rx="28" fill="#eff6ff" filter="url(#shadow)" transform="rotate(3 636 245)"/>
  <rect x="752" y="374" width="290" height="260" rx="28" fill="#f5f3ff" filter="url(#shadow)" transform="rotate(-4 897 504)"/>
  <rect x="284" y="456" width="342" height="284" rx="30" fill="#fff" filter="url(#shadow)" transform="rotate(4 455 598)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="214" y="212" fill="#9a3412" font-size="27" font-weight="900">Launch notes</text>
    <text x="214" y="260" fill="#7c2d12" font-size="22" font-weight="800">- one app</text>
    <text x="214" y="300" fill="#7c2d12" font-size="22" font-weight="800">- fast outputs</text>
    <text x="214" y="340" fill="#7c2d12" font-size="22" font-weight="800">- simple UX</text>
    <text x="536" y="188" fill="#1d4ed8" font-size="27" font-weight="900">Audience</text>
    <text x="536" y="238" fill="#1e3a8a" font-size="22" font-weight="800">Creators</text>
    <text x="536" y="278" fill="#1e3a8a" font-size="22" font-weight="800">Small teams</text>
    <text x="536" y="318" fill="#1e3a8a" font-size="22" font-weight="800">Founders</text>
    <text x="802" y="450" fill="#6d28d9" font-size="27" font-weight="900">Slides</text>
    <text x="802" y="500" fill="#4c1d95" font-size="22" font-weight="800">1. Problem</text>
    <text x="802" y="540" fill="#4c1d95" font-size="22" font-weight="800">2. Solution</text>
    <text x="802" y="580" fill="#4c1d95" font-size="22" font-weight="800">3. Demo</text>
    <text x="350" y="534" fill="#0f172a" font-size="30" font-weight="900">SAVI pitch</text>
    <text x="350" y="590" fill="#475569" font-size="22" font-weight="800">Turn rough ideas</text>
    <text x="350" y="630" fill="#475569" font-size="22" font-weight="800">into reusable systems.</text>
  </g>
