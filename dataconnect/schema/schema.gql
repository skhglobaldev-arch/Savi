type SaviUser @table(name: "savi_users") @unique(fields: ["provider", "providerSubject"]) {
  id: UUID! @default(expr: "uuidV4()")
  provider: String!
  providerSubject: String!
  email: String! @unique
  displayName: String!
  avatarUrl: String
  status: String! @default(value: "active")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
  lastLoginAt: Timestamp! @default(expr: "request.time")
}

type LegalConsent
  @table(name: "legal_consents")
  @unique(fields: ["userId", "consentType", "policyVersion"]) {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  consentType: String!
  policyVersion: String!
  source: String!
  metadata: String
  acceptedAt: Timestamp! @default(expr: "request.time")
}

type AccountDeletionRequest
  @table(name: "account_deletion_requests")
  @unique(fields: ["userId"]) {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  status: String! @default(value: "requested")
  requestedAt: Timestamp! @default(expr: "request.time")
  processedAt: Timestamp
  metadata: String
}

type CreditAccount @table(name: "credit_accounts") {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID! @unique
  user: SaviUser! @ref(fields: "userId", references: "id")
  availableCredits: Int! @default(value: 0)
  reservedCredits: Int! @default(value: 0)
  subscriptionCredits: Int! @default(value: 0)
  reservedSubscriptionCredits: Int! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type GenerationJob @table(name: "generation_jobs") @unique(fields: ["userId", "clientRequestId"]) {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  toolId: String!
  provider: String!
  model: String!
  status: String!
  reservedCredits: Int! @default(value: 0)
  finalCredits: Int! @default(value: 0)
  clientRequestId: String!
  providerRequestId: String
  retryCount: Int! @default(value: 0)
  failureCategory: String
  failureMessage: String
  usageMetadata: String
  createdAt: Timestamp! @default(expr: "request.time")
  startedAt: Timestamp
  completedAt: Timestamp
  failedAt: Timestamp
}

type CreditReservation @table(name: "credit_reservations") {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  jobId: UUID! @unique
  job: GenerationJob! @ref(fields: "jobId", references: "id")
  amount: Int!
  subscriptionCredits: Int! @default(value: 0)
  status: String!
  createdAt: Timestamp! @default(expr: "request.time")
  finalizedAt: Timestamp
  releasedAt: Timestamp
}

type CreditTransaction @table(name: "credit_transactions") {
  id: UUID! @default(expr: "uuidV4()")
  eventKey: String! @unique
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  jobId: UUID
  job: GenerationJob @ref(fields: "jobId", references: "id")
  reservationId: UUID
  reservation: CreditReservation @ref(fields: "reservationId", references: "id")
  type: String!
  amount: Int!
  reason: String!
  metadata: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Asset @table(name: "assets") {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  jobId: UUID! @unique
  job: GenerationJob! @ref(fields: "jobId", references: "id")
  toolId: String!
  mediaType: String!
  mimeType: String!
  storagePath: String! @unique
  filename: String!
  sizeBytes: Int
  status: String!
  creditCost: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

type AiUsage @table(name: "ai_usage") {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  jobId: UUID! @unique
  job: GenerationJob! @ref(fields: "jobId", references: "id")
  toolId: String!
  provider: String!
  model: String!
  inputReferenceCount: Int! @default(value: 0)
  imageCount: Int! @default(value: 0)
  resolution: String
  durationMs: Int
  retryCount: Int! @default(value: 0)
  success: Boolean!
  providerRequestId: String
  inputTokens: Int
  outputTokens: Int
  creditsReserved: Int! @default(value: 0)
  creditsCharged: Int! @default(value: 0)
  creditsReleased: Int! @default(value: 0)
  metadata: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type CommerceCustomer
  @table(name: "commerce_customers")
  @unique(fields: ["userId", "provider"])
  @unique(fields: ["provider", "providerCustomerId"]) {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  provider: String!
  providerCustomerId: String!
  email: String
  metadata: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CommerceSubscription
  @table(name: "commerce_subscriptions")
  @unique(fields: ["provider", "providerSubscriptionId"]) {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  commerceCustomerId: UUID!
  commerceCustomer: CommerceCustomer! @ref(fields: "commerceCustomerId", references: "id")
  provider: String!
  providerSubscriptionId: String!
  providerCustomerId: String!
  planId: String!
  catalogVersion: String!
  status: String!
  providerStatus: String!
  currentPeriodStart: Timestamp
  currentPeriodEnd: Timestamp
  cancelAtPeriodEnd: Boolean! @default(value: false)
  canceledAt: Timestamp
  metadata: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CommercePurchase
  @table(name: "commerce_purchases")
  @unique(fields: ["provider", "providerCheckoutSessionId"])
  @unique(fields: ["provider", "providerPaymentIntentId"]) {
  id: UUID! @default(expr: "uuidV4()")
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  commerceCustomerId: UUID!
  commerceCustomer: CommerceCustomer! @ref(fields: "commerceCustomerId", references: "id")
  provider: String!
  purchaseType: String!
  catalogItemId: String!
  catalogVersion: String!
  status: String!
  providerCheckoutSessionId: String
  providerPaymentIntentId: String
  providerInvoiceId: String
  currency: String
  amountTotalMinor: Int
  creditsGranted: Int! @default(value: 0)
  metadata: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type PaymentEvent
  @table(name: "payment_events")
  @unique(fields: ["provider", "providerEventId"]) {
  id: UUID! @default(expr: "uuidV4()")
  provider: String!
  providerEventId: String!
  eventType: String!
  livemode: Boolean! @default(value: false)
  objectId: String
  userId: UUID
  user: SaviUser @ref(fields: "userId", references: "id")
  status: String!
  errorMessage: String
  metadata: String
  createdAt: Timestamp! @default(expr: "request.time")
  processedAt: Timestamp
}

type CreditGrant
  @table(name: "credit_grants")
  @unique(fields: ["grantKey"]) {
  id: UUID! @default(expr: "uuidV4()")
  grantKey: String!
  userId: UUID!
  user: SaviUser! @ref(fields: "userId", references: "id")
  purchaseId: UUID
  purchase: CommercePurchase @ref(fields: "purchaseId", references: "id")
  subscriptionId: UUID
  subscription: CommerceSubscription @ref(fields: "subscriptionId", references: "id")
  provider: String!
  providerEventId: String!
  providerInvoiceId: String
  grantType: String!
  catalogItemId: String!
  catalogVersion: String!
  billingPeriodStart: Timestamp
  billingPeriodEnd: Timestamp
  credits: Int!
  ledgerTransactionId: UUID!
  status: String!
  metadata: String
  createdAt: Timestamp! @default(expr: "request.time")
}
