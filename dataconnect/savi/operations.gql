mutation GrantWelcomeCredit(
  $grantId: UUID!
  $transactionId: UUID!
  $grantKey: String!
  $provider: String!
  $providerEventId: String!
  $userId: UUID!
  $welcomeCredits: Int!
  $catalogVersion: String!
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  creditGrant_insert(data: {
    id: $grantId
    grantKey: $grantKey
    userId: $userId
    provider: $provider
    providerEventId: $providerEventId
    grantType: "welcome_grant"
    catalogItemId: "free"
    catalogVersion: $catalogVersion
    credits: $welcomeCredits
    ledgerTransactionId: $transactionId
    status: "granted"
    metadata: $metadata
  })
  creditAccount_updateMany(
    where: { userId: { eq: $userId } }
    data: {
      availableCredits_update: { inc: $welcomeCredits }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "CREDIT_ACCOUNT_MISSING")
  creditTransaction_insert(data: {
    id: $transactionId
    eventKey: $grantKey
    userId: $userId
    type: "credit_grant"
    amount: $welcomeCredits
    reason: "welcome_grant"
    metadata: $metadata
  })
}

mutation ReconcileDuplicateWelcomeGrant(
  $transactionId: UUID!
  $eventKey: String!
  $userId: UUID!
  $expectedAvailableCredits: Int!
  $expectedSubscriptionCredits: Int!
  $expectedReservedCredits: Int!
  $expectedReservedSubscriptionCredits: Int!
  $ledgerAmount: Int!
  $creditsToRemove: Int!
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  creditAccount_updateMany(
    where: {
      userId: { eq: $userId }
      availableCredits: { eq: $expectedAvailableCredits, ge: $creditsToRemove }
      subscriptionCredits: { eq: $expectedSubscriptionCredits }
      reservedCredits: { eq: $expectedReservedCredits }
      reservedSubscriptionCredits: { eq: $expectedReservedSubscriptionCredits }
    }
    data: {
      availableCredits_update: { dec: $creditsToRemove }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "CREDIT_ACCOUNT_STATE_CHANGED")
  creditTransaction_insert(data: {
    id: $transactionId
    eventKey: $eventKey
    userId: $userId
    type: "credit_adjustment"
    amount: $ledgerAmount
    reason: "welcome_duplicate_reconciliation"
    metadata: $metadata
  })
}

