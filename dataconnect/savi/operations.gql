mutation FulfillSubscriptionCreditGrant(
  $eventId: UUID!
  $grantId: UUID!
  $ledgerTransactionId: UUID!
  $provider: String!
  $providerEventId: String!
  $eventType: String!
  $livemode: Boolean!
  $objectId: String
  $userId: UUID!
  $subscriptionId: UUID!
  $planId: String!
  $catalogVersion: String!
  $providerInvoiceId: String!
  $creditsGranted: Int!
  $expectedSubscriptionCredits: Int!
  $expectedReservedSubscriptionCredits: Int!
  $grantStatus: String!
  $ledgerReason: String!
  $grantKey: String!
  $billingPeriodStart: Timestamp
  $billingPeriodEnd: Timestamp
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  paymentEvent_insert(data: {
    id: $eventId
    provider: $provider
    providerEventId: $providerEventId
    eventType: $eventType
    livemode: $livemode
    objectId: $objectId
    userId: $userId
    status: "processed"
    metadata: $metadata
    processedAt_expr: "request.time"
  })
  creditGrant_insert(data: {
    id: $grantId
    grantKey: $grantKey
    userId: $userId
    subscriptionId: $subscriptionId
    provider: $provider
    providerEventId: $providerEventId
    providerInvoiceId: $providerInvoiceId
    grantType: "subscription_cycle"
    catalogItemId: $planId
    catalogVersion: $catalogVersion
    billingPeriodStart: $billingPeriodStart
    billingPeriodEnd: $billingPeriodEnd
    credits: $creditsGranted
    ledgerTransactionId: $ledgerTransactionId
    status: $grantStatus
    metadata: $metadata
  })
  creditAccount_updateMany(
    where: {
      userId: { eq: $userId }
      subscriptionCredits: { eq: $expectedSubscriptionCredits }
      reservedSubscriptionCredits: { eq: $expectedReservedSubscriptionCredits }
    }
    data: {
      availableCredits_update: { inc: $creditsGranted }
      subscriptionCredits_update: { inc: $creditsGranted }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "CREDIT_ACCOUNT_MISSING")
  creditTransaction_insert(data: {
    id: $ledgerTransactionId
    eventKey: $grantKey
    userId: $userId
    type: "credit_grant"
    amount: $creditsGranted
    reason: $ledgerReason
    metadata: $metadata
  })
}
