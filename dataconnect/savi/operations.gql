mutation FulfillTopUpPurchase(
  $eventId: UUID!
  $purchaseId: UUID!
  $grantId: UUID!
  $ledgerTransactionId: UUID!
  $provider: String!
  $providerEventId: String!
  $eventType: String!
  $livemode: Boolean!
  $objectId: String
  $userId: UUID!
  $commerceCustomerId: UUID!
  $purchaseType: String!
  $packId: String!
  $catalogVersion: String!
  $providerCheckoutSessionId: String
  $providerPaymentIntentId: String
  $currency: String
  $amountTotalMinor: Int
  $creditsGranted: Int!
  $grantKey: String!
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  paymentEvent_insert(data: {
    id: $eventId
    provider: $provider
    providerEventId: $providerEventId
    eventType: $eventType
    livemode: $livemode
    objectId: $objectId
    userId: $userId
    status: "processed"
    metadata: $metadata
    processedAt_expr: "request.time"
  })
  commercePurchase_insert(data: {
    id: $purchaseId
    userId: $userId
    commerceCustomerId: $commerceCustomerId
    provider: $provider
    purchaseType: $purchaseType
    catalogItemId: $packId
    catalogVersion: $catalogVersion
    status: "fulfilled"
    providerCheckoutSessionId: $providerCheckoutSessionId
    providerPaymentIntentId: $providerPaymentIntentId
    currency: $currency
    amountTotalMinor: $amountTotalMinor
    creditsGranted: $creditsGranted
    metadata: $metadata
    updatedAt_expr: "request.time"
  })
  creditGrant_insert(data: {
    id: $grantId
    grantKey: $grantKey
    userId: $userId
    purchaseId: $purchaseId
    provider: $provider
    providerEventId: $providerEventId
    grantType: "topup_purchase"
    catalogItemId: $packId
    catalogVersion: $catalogVersion
    credits: $creditsGranted
    ledgerTransactionId: $ledgerTransactionId
    status: "granted"
    metadata: $metadata
  })
  creditAccount_updateMany(
    where: { userId: { eq: $userId } }
    data: {
      availableCredits_update: { inc: $creditsGranted }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "CREDIT_ACCOUNT_MISSING")
  creditTransaction_insert(data: {
    id: $ledgerTransactionId
    eventKey: $grantKey
    userId: $userId
    type: "credit_grant"
    amount: $creditsGranted
    reason: "topup_purchase"
    metadata: $metadata
  })
}

