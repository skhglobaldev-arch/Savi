  ) @check(expr: "this == 1", message: "INSUFFICIENT_CREDITS")
  generationJob_insert(data: {
    id: $jobId
    userId: $userId
    toolId: $toolId
    provider: $provider
    model: $model
    status: "processing"
    reservedCredits: $credits
    finalCredits: 0
    clientRequestId: $clientRequestId
    retryCount: 0
    startedAt_expr: "request.time"
  })
  creditReservation_insert(data: {
    id: $reservationId
    userId: $userId
    jobId: $jobId
    amount: $credits
    status: "reserved"
