# These operations intentionally have no client access. SAVI executes them only
# from a Next.js server after verifying its existing signed Google OAuth session.

query FindSaviUserByProvider($provider: String!, $providerSubject: String!) @auth(level: NO_ACCESS) {
  saviUsers(where: { provider: { eq: $provider }, providerSubject: { eq: $providerSubject } }, limit: 1) {
    id
    provider
    providerSubject
    email
    displayName
    avatarUrl
    status
  }
}

mutation CreateSaviUserAndAccount(
  $userId: UUID!
  $accountId: UUID!
  $provider: String!
  $providerSubject: String!
  $email: String!
  $displayName: String!
  $avatarUrl: String
) @transaction @auth(level: NO_ACCESS) {
  saviUser_insert(data: {
    id: $userId
    provider: $provider
    providerSubject: $providerSubject
    email: $email
    displayName: $displayName
    avatarUrl: $avatarUrl
    status: "active"
    updatedAt_expr: "request.time"
    lastLoginAt_expr: "request.time"
  })
  creditAccount_insert(data: {
    id: $accountId
    userId: $userId
    availableCredits: 0
    reservedCredits: 0
    updatedAt_expr: "request.time"
  })
}

mutation CreateSaviUserAndAccountWithDevelopmentGrant(
  $userId: UUID!
  $accountId: UUID!
  $transactionId: UUID!
  $eventKey: String!
  $provider: String!
  $providerSubject: String!
  $email: String!
  $displayName: String!
  $avatarUrl: String
  $developmentCredits: Int!
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  saviUser_insert(data: {
    id: $userId
    provider: $provider
    providerSubject: $providerSubject
    email: $email
    displayName: $displayName
    avatarUrl: $avatarUrl
    status: "active"
    updatedAt_expr: "request.time"
    lastLoginAt_expr: "request.time"
  })
  creditAccount_insert(data: {
    id: $accountId
    userId: $userId
    availableCredits: $developmentCredits
    reservedCredits: 0
    updatedAt_expr: "request.time"
  })
  creditTransaction_insert(data: {
    id: $transactionId
    eventKey: $eventKey
    userId: $userId
    type: "credit_grant"
    amount: $developmentCredits
    reason: "development_initial_grant"
    metadata: $metadata
  })
}

mutation TouchSaviUser(
  $userId: UUID!
  $email: String!
  $displayName: String!
  $avatarUrl: String
) @auth(level: NO_ACCESS) {
  saviUser_update(id: $userId, data: {
    email: $email
    displayName: $displayName
    avatarUrl: $avatarUrl
    updatedAt_expr: "request.time"
    lastLoginAt_expr: "request.time"
  })
}

query GetCreditAccount($userId: UUID!) @auth(level: NO_ACCESS) {
  creditAccounts(where: { userId: { eq: $userId } }, limit: 1) {
    id
    userId
    availableCredits
    reservedCredits
  }
}

query FindGenerationJob($userId: UUID!, $clientRequestId: String!) @auth(level: NO_ACCESS) {
  generationJobs(where: { userId: { eq: $userId }, clientRequestId: { eq: $clientRequestId } }, limit: 1) {
    id
