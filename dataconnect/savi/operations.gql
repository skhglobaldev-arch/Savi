# These operations intentionally have no client access. SAVI executes them only
# from a Next.js server after verifying its existing signed Google OAuth session.

query FindSaviUserByProvider($provider: String!, $providerSubject: String!) @auth(level: NO_ACCESS) {
  saviUsers(where: { provider: { eq: $provider }, providerSubject: { eq: $providerSubject } }, limit: 1) {
    id
    provider
    providerSubject
    email
    displayName
    avatarUrl
    status
  }
}

query FindLegalConsent($userId: UUID!, $consentType: String!, $policyVersion: String!) @auth(level: NO_ACCESS) {
