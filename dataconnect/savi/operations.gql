# Provider-neutral commerce operations. Stripe is the first provider, but these
# records and credit grants are intentionally not Stripe-specific so future
# Apple StoreKit verification can grant credits through the same ledger/account.

query FindCommerceCustomer($userId: UUID!, $provider: String!) @auth(level: NO_ACCESS) {
  commerceCustomers(where: { userId: { eq: $userId }, provider: { eq: $provider } }, limit: 1) {
    id
    userId
    provider
    providerCustomerId
    email
    metadata
    createdAt
    updatedAt
  }
}

query FindCommerceCustomerByProviderId($provider: String!, $providerCustomerId: String!) @auth(level: NO_ACCESS) {
  commerceCustomers(where: { provider: { eq: $provider }, providerCustomerId: { eq: $providerCustomerId } }, limit: 1) {
    id
    userId
    provider
    providerCustomerId
    email
    metadata
    createdAt
    updatedAt
  }
}

mutation CreateCommerceCustomer(
  $id: UUID!
  $userId: UUID!
  $provider: String!
  $providerCustomerId: String!
  $email: String
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  commerceCustomer_insert(data: {
    id: $id
    userId: $userId
    provider: $provider
    providerCustomerId: $providerCustomerId
    email: $email
    metadata: $metadata
    updatedAt_expr: "request.time"
  })
}

query GetCommerceBillingState($userId: UUID!) @auth(level: NO_ACCESS) {
  commerceCustomers(where: { userId: { eq: $userId } }, limit: 10) {
    id
    provider
    providerCustomerId
    email
    createdAt
    updatedAt
  }
  commerceSubscriptions(where: { userId: { eq: $userId } }, limit: 10) {
    id
    provider
    providerSubscriptionId
    providerCustomerId
    planId
    catalogVersion
    status
    providerStatus
    currentPeriodStart
    currentPeriodEnd
    cancelAtPeriodEnd
    canceledAt
    createdAt
    updatedAt
  }
  commercePurchases(where: { userId: { eq: $userId } }, limit: 25) {
    id
    provider
    purchaseType
    catalogItemId
    catalogVersion
    status
    providerCheckoutSessionId
    providerPaymentIntentId
    providerInvoiceId
    currency
    amountTotalMinor
    creditsGranted
    createdAt
    updatedAt
  }
  creditGrants(where: { userId: { eq: $userId } }, limit: 25) {
    id
    grantKey
    provider
    providerEventId
    providerInvoiceId
    grantType
    catalogItemId
    catalogVersion
    billingPeriodStart
    billingPeriodEnd
    credits
    status
    createdAt
  }
}

