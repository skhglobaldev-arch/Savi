mutation ReserveTextToImageJob(
  $jobId: UUID!
  $reservationId: UUID!
  $reservationTransactionId: UUID!
  $reservationEventKey: String!
  $userId: UUID!
  $toolId: String!
  $provider: String!
  $model: String!
  $clientRequestId: String!
  $credits: Int!
  $expectedSubscriptionCredits: Int!
  $expectedReservedSubscriptionCredits: Int!
  $subscriptionCredits: Int!
  $reservationLedgerAmount: Int!
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  creditAccount_updateMany(
    where: {
      userId: { eq: $userId }
      availableCredits: { ge: $credits }
      subscriptionCredits: { eq: $expectedSubscriptionCredits }
      reservedSubscriptionCredits: { eq: $expectedReservedSubscriptionCredits }
    }
    data: {
      availableCredits_update: { dec: $credits }
      reservedCredits_update: { inc: $credits }
      subscriptionCredits_update: { dec: $subscriptionCredits }
      reservedSubscriptionCredits_update: { inc: $subscriptionCredits }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "CREDIT_ACCOUNT_STATE_CHANGED")
  generationJob_insert(data: {
    id: $jobId
    userId: $userId
    toolId: $toolId
    provider: $provider
    model: $model
    status: "processing"
    reservedCredits: $credits
    finalCredits: 0
    clientRequestId: $clientRequestId
    retryCount: 0
    startedAt_expr: "request.time"
  })
  creditReservation_insert(data: {
    id: $reservationId
    userId: $userId
    jobId: $jobId
    amount: $credits
    subscriptionCredits: $subscriptionCredits
    status: "reserved"
  })
  creditTransaction_insert(data: {
    id: $reservationTransactionId
    eventKey: $reservationEventKey
    userId: $userId
    jobId: $jobId
    reservationId: $reservationId
    type: "reservation"
    amount: $reservationLedgerAmount
    reason: "text_to_image_reservation"
    metadata: $metadata
  })
}

mutation FinalizeTextToImageJob(
  $jobId: UUID!
  $reservationId: UUID!
  $chargeTransactionId: UUID!
  $chargeEventKey: String!
  $assetId: UUID!
  $usageId: UUID!
  $userId: UUID!
  $credits: Int!
  $subscriptionCredits: Int!
  $model: String!
  $chargeLedgerAmount: Int!
  $providerRequestId: String
  $usageMetadata: String
  $assetStoragePath: String!
  $assetFilename: String!
  $assetMimeType: String!
  $assetSizeBytes: Int
  $resolution: String
  $durationMs: Int
  $inputReferenceCount: Int!
  $imageCount: Int!
  $inputTokens: Int
  $outputTokens: Int
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  query @check(expr: "response.query.creditReservations.size() == 1", message: "RESERVATION_NOT_ACTIVE") {
    creditReservations(where: {
      id: { eq: $reservationId }
      userId: { eq: $userId }
      jobId: { eq: $jobId }
      status: { eq: "reserved" }
    }, limit: 1) {
      id
    }
  }
  creditReservation_updateMany(
    where: { id: { eq: $reservationId }, status: { eq: "reserved" } }
    data: { status: "finalized", finalizedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "RESERVATION_NOT_ACTIVE")
  creditAccount_updateMany(
    where: {
      userId: { eq: $userId }
      reservedCredits: { ge: $credits }
      reservedSubscriptionCredits: { ge: $subscriptionCredits }
    }
    data: {
      reservedCredits_update: { dec: $credits }
      reservedSubscriptionCredits_update: { dec: $subscriptionCredits }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "CREDIT_ACCOUNT_MISMATCH")
  generationJob_updateMany(
    where: { id: { eq: $jobId }, userId: { eq: $userId }, status: { eq: "processing" } }
    data: {
      status: "completed"
      finalCredits: $credits
      providerRequestId: $providerRequestId
      usageMetadata: $usageMetadata
      completedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "JOB_NOT_PROCESSING")
  asset_insert(data: {
    id: $assetId
    userId: $userId
    jobId: $jobId
    toolId: "text_to_image"
    mediaType: "image"
    mimeType: $assetMimeType
    storagePath: $assetStoragePath
    filename: $assetFilename
    sizeBytes: $assetSizeBytes
    status: "available"
    creditCost: $credits
  })
  aiUsage_insert(data: {
    id: $usageId
    userId: $userId
    jobId: $jobId
    toolId: "text_to_image"
    provider: "gemini"
    model: $model
    inputReferenceCount: $inputReferenceCount
    imageCount: $imageCount
    resolution: $resolution
    durationMs: $durationMs
    retryCount: 0
    success: true
    providerRequestId: $providerRequestId
    inputTokens: $inputTokens
    outputTokens: $outputTokens
    creditsReserved: $credits
    creditsCharged: $credits
    creditsReleased: 0
    metadata: $metadata
  })
  creditTransaction_insert(data: {
    id: $chargeTransactionId
    eventKey: $chargeEventKey
    userId: $userId
    jobId: $jobId
    reservationId: $reservationId
    type: "generation_charge"
    amount: $chargeLedgerAmount
    reason: "text_to_image_finalized"
    metadata: $metadata
  })
}

mutation ReleaseTextToImageReservation(
  $jobId: UUID!
  $reservationId: UUID!
  $releaseTransactionId: UUID!
  $releaseEventKey: String!
  $usageId: UUID!
  $userId: UUID!
  $credits: Int!
  $subscriptionCredits: Int!
  $model: String!
  $releaseLedgerAmount: Int!
  $failureCategory: String!
  $failureMessage: String!
  $providerRequestId: String
  $resolution: String
  $durationMs: Int
  $inputReferenceCount: Int!
  $inputTokens: Int
  $outputTokens: Int
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  query @check(expr: "response.query.creditReservations.size() == 1", message: "RESERVATION_NOT_ACTIVE") {
    creditReservations(where: {
      id: { eq: $reservationId }
      userId: { eq: $userId }
      jobId: { eq: $jobId }
      status: { eq: "reserved" }
    }, limit: 1) {
      id
    }
  }
  creditReservation_updateMany(
    where: { id: { eq: $reservationId }, status: { eq: "reserved" } }
    data: { status: "released", releasedAt_expr: "request.time" }
  ) @check(expr: "this == 1", message: "RESERVATION_NOT_ACTIVE")
  creditAccount_updateMany(
    where: {
      userId: { eq: $userId }
      reservedCredits: { ge: $credits }
      reservedSubscriptionCredits: { ge: $subscriptionCredits }
    }
    data: {
      availableCredits_update: { inc: $credits }
      reservedCredits_update: { dec: $credits }
      subscriptionCredits_update: { inc: $subscriptionCredits }
      reservedSubscriptionCredits_update: { dec: $subscriptionCredits }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "CREDIT_ACCOUNT_MISMATCH")
  generationJob_updateMany(
    where: { id: { eq: $jobId }, userId: { eq: $userId }, status: { eq: "processing" } }
    data: {
      status: "failed"
      failureCategory: $failureCategory
      failureMessage: $failureMessage
      providerRequestId: $providerRequestId
      failedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "JOB_NOT_PROCESSING")
  aiUsage_insert(data: {
    id: $usageId
    userId: $userId
    jobId: $jobId
    toolId: "text_to_image"
    provider: "gemini"
    model: $model
    inputReferenceCount: $inputReferenceCount
    imageCount: 0
    resolution: $resolution
    durationMs: $durationMs
    retryCount: 0
    success: false
    providerRequestId: $providerRequestId
    inputTokens: $inputTokens
    outputTokens: $outputTokens
    creditsReserved: $credits
    creditsCharged: 0
    creditsReleased: $credits
    metadata: $metadata
  })
  creditTransaction_insert(data: {
    id: $releaseTransactionId
    eventKey: $releaseEventKey
    userId: $userId
    jobId: $jobId
    reservationId: $reservationId
    type: "refund"
    amount: $releaseLedgerAmount
    reason: "text_to_image_reservation_released"
    metadata: $metadata
  })
}

# Generic protected-operation mutations. They use the same authoritative
# account, reservation, job, asset, and usage tables as Text to Image, while
# allowing another SAVI tool to retain its real tool/provider/media metadata.
# These remain unavailable to ordinary Data Connect clients.

mutation ReserveGenerationJob(
  $jobId: UUID!
  $reservationId: UUID!
  $reservationTransactionId: UUID!
  $reservationEventKey: String!
  $userId: UUID!
  $toolId: String!
  $provider: String!
  $model: String!
  $clientRequestId: String!
  $credits: Int!
  $expectedSubscriptionCredits: Int!
  $expectedReservedSubscriptionCredits: Int!
  $subscriptionCredits: Int!
  $reservationLedgerAmount: Int!
  $reservationReason: String!
  $metadata: String!
) @transaction @auth(level: NO_ACCESS) {
  creditAccount_updateMany(
    where: {
      userId: { eq: $userId }
      availableCredits: { ge: $credits }
      subscriptionCredits: { eq: $expectedSubscriptionCredits }
      reservedSubscriptionCredits: { eq: $expectedReservedSubscriptionCredits }
    }
    data: {
      availableCredits_update: { dec: $credits }
      reservedCredits_update: { inc: $credits }
      subscriptionCredits_update: { dec: $subscriptionCredits }
      reservedSubscriptionCredits_update: { inc: $subscriptionCredits }
      updatedAt_expr: "request.time"
    }
  ) @check(expr: "this == 1", message: "CREDIT_ACCOUNT_STATE_CHANGED")
  generationJob_insert(data: {
    id: $jobId
    userId: $userId
    toolId: $toolId
    provider: $provider
    model: $model
    status: "processing"
    reservedCredits: $credits
    finalCredits: 0
    clientRequestId: $clientRequestId
    retryCount: 0
    startedAt_expr: "request.time"
  })
  creditReservation_insert(data: {
    id: $reservationId
    userId: $userId
    jobId: $jobId
    amount: $credits
    subscriptionCredits: $subscriptionCredits
    status: "reserved"
  })
  creditTransaction_insert(data: {
    id: $reservationTransactionId
    eventKey: $reservationEventKey
    userId: $userId
    jobId: $jobId
    reservationId: $reservationId
    type: "reservation"
    amount: $reservationLedgerAmount
    reason: $reservationReason
    metadata: $metadata
  })
}

